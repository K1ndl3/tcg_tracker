services:
  db:
    image: postgres:16-alpine
    container_name: tcg_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg_dev_password
      POSTGRES_DB: tcg_tracker
    ports:
      - "5432:5432"
    volumes:
      - tcg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tcg_pgdata:
